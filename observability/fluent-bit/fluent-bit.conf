
[SERVICE]
    Flush             5
    Daemon            Off
    Log_Level         info
    Parsers_File      /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Tag               springboot.user
    Path              /logs/user-api.log
    Parser            json
    DB                /fluent-bit/state/user-api.db
    Read_from_Head    On
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB

[INPUT]
    Name              tail
    Tag               springboot.learning
    Path              /learning-logs/learning-api.log
    Parser            json
    DB                /fluent-bit/state/learning-api.db
    Read_from_Head    On
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB

[INPUT]
    Name              tail
    Tag               springboot.jwks
    Path              /jwks-logs/jwks-api.log
    Parser            json
    DB                /fluent-bit/state/jwks-api.db
    Read_from_Head    On
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB

[FILTER]
    Name              modify
    Match             springboot.*
    Add               environment ${DEPLOYMENT_ENVIRONMENT}

[OUTPUT]
    Name              loki
    Match             springboot.*
    Host              loki
    Port              3100
    Labels            job=springboot,service=$service,environment=$environment
    Line_Format       json
    Retry_Limit       False

[OUTPUT]
    Name                opensearch
    Match               springboot.user
    Host                opensearch
    Port                9200
    Index               springboot-user-logs
    Suppress_Type_Name  On
    Generate_ID         On
    Retry_Limit         False

[OUTPUT]
    Name                opensearch
    Match               springboot.learning
    Host                opensearch
    Port                9200
    Index               springboot-learning-logs
    Suppress_Type_Name  On
    Generate_ID         On
    Retry_Limit         False

[OUTPUT]
    Name                opensearch
    Match               springboot.jwks
    Host                opensearch
    Port                9200
    Index               springboot-jwks-logs
    Suppress_Type_Name  On
    Generate_ID         On
    Retry_Limit         False

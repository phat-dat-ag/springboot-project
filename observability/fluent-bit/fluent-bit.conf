
[SERVICE]
    Flush             5
    Daemon            Off
    Log_Level         info
    Parsers_File      /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Tag               springboot.user
    Path              /logs/user-api.log
    Parser            json
    DB                /fluent-bit/state/user-api.db
    Read_from_Head    On
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB

[FILTER]
    Name              modify
    Match             springboot.user
    Add               environment development

[OUTPUT]
    Name              loki
    Match             springboot.user
    Host              loki
    Port              3100
    Labels            job=springboot,service=user,environment=development
    Line_Format       json
    Retry_Limit       False

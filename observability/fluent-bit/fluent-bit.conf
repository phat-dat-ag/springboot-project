
[SERVICE]
    Flush             5
    Daemon            Off
    Log_Level         info
    Parsers_File      /fluent-bit/etc/application-parsers.conf
    Grace             30
    scheduler.base    1
    scheduler.cap     10
    storage.path      /fluent-bit/state/buffer
    storage.sync      full
    storage.checksum  on
    storage.max_chunks_up 16
    storage.backlog.mem_limit 16M
    storage.metrics   on
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020

[INPUT]
    Name              tail
    Tag               springboot.user
    Path              /logs/user-api.log
    Parser            application_json
    DB                /fluent-bit/state/user-api.db
    DB.sync           Full
    DB.journal_mode   WAL
    Read_from_Head    On
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    storage.type      filesystem
    Buffer_Max_Size   256k

[INPUT]
    Name              tail
    Tag               springboot.learning
    Path              /learning-logs/learning-api.log
    Parser            application_json
    DB                /fluent-bit/state/learning-api.db
    DB.sync           Full
    DB.journal_mode   WAL
    Read_from_Head    On
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    storage.type      filesystem
    Buffer_Max_Size   256k

[INPUT]
    Name              tail
    Tag               springboot.jwks
    Path              /jwks-logs/jwks-api.log
    Parser            application_json
    DB                /fluent-bit/state/jwks-api.db
    DB.sync           Full
    DB.journal_mode   WAL
    Read_from_Head    On
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    storage.type      filesystem
    Buffer_Max_Size   256k

# Unparsed/malformed records have no approved service field: never ship raw fallback log strings.
[FILTER]
    Name              grep
    Match             springboot.*
    Regex             service ^(user-learning|learning-api|jwks-service)$

[FILTER]
    Name              modify
    Match             springboot.*
    Add               environment ${DEPLOYMENT_ENVIRONMENT}

[OUTPUT]
    Name              loki
    Match             springboot.*
    Host              loki
    Port              3100
    Labels            job=springboot,service=$service,environment=$environment
    Line_Format       json
    Retry_Limit       False
    storage.total_limit_size ${FLUENT_BIT_LOKI_BUFFER_LIMIT}

[OUTPUT]
    Name                opensearch
    Match               springboot.user
    Host                opensearch
    Port                9200
    Index               springboot-user-logs
    Logstash_Format     On
    Logstash_Prefix     springboot-user
    Logstash_DateFormat %Y.%m.%d-logs
    Suppress_Type_Name  On
    Generate_ID         On
    Retry_Limit         False
    storage.total_limit_size ${FLUENT_BIT_OPENSEARCH_BUFFER_LIMIT}

[OUTPUT]
    Name                opensearch
    Match               springboot.learning
    Host                opensearch
    Port                9200
    Index               springboot-learning-logs
    Logstash_Format     On
    Logstash_Prefix     springboot-learning
    Logstash_DateFormat %Y.%m.%d-logs
    Suppress_Type_Name  On
    Generate_ID         On
    Retry_Limit         False
    storage.total_limit_size ${FLUENT_BIT_OPENSEARCH_BUFFER_LIMIT}

[OUTPUT]
    Name                opensearch
    Match               springboot.jwks
    Host                opensearch
    Port                9200
    Index               springboot-jwks-logs
    Logstash_Format     On
    Logstash_Prefix     springboot-jwks
    Logstash_DateFormat %Y.%m.%d-logs
    Suppress_Type_Name  On
    Generate_ID         On
    Retry_Limit         False
    storage.total_limit_size ${FLUENT_BIT_OPENSEARCH_BUFFER_LIMIT}

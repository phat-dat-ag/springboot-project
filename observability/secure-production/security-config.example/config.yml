{
  "_meta": {
    "type": "config",
    "config_version": 2
  },
  "config": {
    "dynamic": {
      "http": {
        "anonymous_auth_enabled": false
      },
      "authc": {
        "basic_internal": {
          "http_enabled": true,
          "transport_enabled": false,
          "order": 0,
          "http_authenticator": {
            "type": "basic",
            "challenge": false
          },
          "authentication_backend": {
            "type": "intern"
          }
        },
        "client_certificate": {
          "http_enabled": true,
          "transport_enabled": false,
          "order": 1,
          "http_authenticator": {
            "type": "clientcert",
            "config": {
              "username_attribute": "cn"
            },
            "challenge": false
          },
          "authentication_backend": {
            "type": "noop"
          }
        }
      }
    }
  }
}

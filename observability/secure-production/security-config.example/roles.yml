{
  "_meta": {
    "type": "roles",
    "config_version": 2
  },
  "telemetry_writer": {
    "cluster_permissions": [
      "cluster_composite_ops"
    ],
    "index_permissions": [
      {
        "index_patterns": [
          "springboot-user-20*-logs",
          "springboot-learning-20*-logs",
          "springboot-jwks-20*-logs"
        ],
        "allowed_actions": [
          "indices:data/write/bulk*",
          "indices:data/write/index*",
          "indices:data/write/create*",
          "indices:admin/create",
          "indices:admin/mapping/put"
        ]
      }
    ]
  },
  "telemetry_health": {
    "cluster_permissions": [
      "cluster:monitor/health"
    ],
    "index_permissions": []
  }
}

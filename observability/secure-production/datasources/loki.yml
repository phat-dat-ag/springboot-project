apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: https://loki:3100
    isDefault: true
    editable: false
    secureJsonData:
      tlsCACert: $GRAFANA_TLS_CA_PEM
      tlsClientCert: $GRAFANA_TLS_CLIENT_CERT_PEM
      tlsClientKey: $GRAFANA_TLS_CLIENT_KEY_PEM
    jsonData:
      tlsAuth: true
      tlsAuthWithCACert: true
      tlsSkipVerify: false
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId"\s*:\s*"([0-9a-f]{32})"'
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View trace

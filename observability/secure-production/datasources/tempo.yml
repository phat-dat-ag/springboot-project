apiVersion: 1
datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: https://tempo:3200
    isDefault: false
    editable: false
    secureJsonData:
      tlsCACert: $GRAFANA_TLS_CA_PEM
      tlsClientCert: $GRAFANA_TLS_CLIENT_CERT_PEM
      tlsClientKey: $GRAFANA_TLS_CLIENT_KEY_PEM
    jsonData:
      tlsAuth: true
      tlsAuthWithCACert: true
      tlsSkipVerify: false
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        tags:
          - key: service.name
            value: service
        filterByTraceID: true
        filterBySpanID: false

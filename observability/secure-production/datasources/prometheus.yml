apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: https://prometheus:9090
    isDefault: false
    editable: false
    secureJsonData:
      tlsCACert: $GRAFANA_TLS_CA_PEM
      tlsClientCert: $GRAFANA_TLS_CLIENT_CERT_PEM
      tlsClientKey: $GRAFANA_TLS_CLIENT_KEY_PEM
    jsonData:
      tlsAuth: true
      tlsAuthWithCACert: true
      tlsSkipVerify: false
      httpMethod: POST
      timeInterval: 15s

auth_enabled: false

server:
  http_tls_config:
    cert_file: /run/tls/server.crt
    key_file: /run/tls/server.key
    client_ca_file: /run/tls/ca.pem
    client_auth_type: RequireAndVerifyClientCert
  grpc_listen_address: 127.0.0.1
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  wal:
    enabled: true
    dir: /loki/wal
    replay_memory_ceiling: 128MB
    flush_on_shutdown: true

limits_config:
  retention_period: 720h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  per_stream_rate_limit: 1MB
  per_stream_rate_limit_burst: 2MB
  max_global_streams_per_user: 1000
  max_query_parallelism: 4
  tsdb_max_query_parallelism: 4
  max_query_length: 744h
  query_timeout: 30s
  max_entries_limit_per_query: 5000

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 2h
  retention_delete_worker_count: 4

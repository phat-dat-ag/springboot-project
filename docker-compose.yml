# Shared runtime restrictions; writable state is declared explicitly per service.
x-container-security: &container-security
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  ulimits:
    core: 0

services:
  mysql:
    <<: *container-security
    # The pinned vendor initializer interpolates SQL literals and a quoted option
    # file. Reject unsupported values before it can echo a credential in an error.
    entrypoint:
      - /bin/bash
      - -ec
      - |
        for name in MYSQL_DATABASE MYSQL_USER; do
          value="$${!name-}"
          if [[ ! "$$value" =~ ^[A-Za-z0-9_-]{1,64}$$ ]]; then
            echo "Invalid $$name: use 1-64 ASCII letters, digits, underscores or hyphens." >&2
            exit 64
          fi
        done
        for name in MYSQL_ROOT_PASSWORD MYSQL_PASSWORD; do
          value="$${!name-}"
          if [[ -z "$${value//[[:space:]]/}" || "$$value" == *"'"* || "$$value" == *'"'* || "$$value" == *'\'* || "$$value" =~ [[:cntrl:]] ]]; then
            echo "Invalid $$name: a nonblank password without quotes, backslashes or control characters is required by this MySQL image." >&2
            exit 64
          fi
        done
        exec /usr/local/bin/docker-entrypoint.sh mysqld
    user: "999:999"
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 60s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/mysqld:rw,noexec,nosuid,nodev,size=16m,uid=999,gid=999,mode=0750
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mydb}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:-datnguyen}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3336}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    <<: *container-security
    image: postgres:17.6
    user: "999:999"

    restart: unless-stopped

    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 60s

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=999,gid=999,mode=0750

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-datnguyen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  flyway-mysql:
    <<: *container-security
    user: "10001:10001"
    working_dir: /tmp
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 30s
    tmpfs:
      # Java native libraries may require executable mappings from temporary storage.
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    image: flyway/flyway:latest@sha256:c748a1e82c40d4ee63b2f02a78295cf2460e8b4f1abae8abcd7ad5d6e879f959
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-japanese_learning}
      FLYWAY_USER: ${MYSQL_USER:-japanese_learning}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      FLYWAY_CONNECT_RETRIES: "60"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      JAVA_ARGS: -Duser.home=/tmp
      APP_LOG_DIR: ${APP_LOG_DIR:-/app/data/logs}
      APP_NAME: ${APP_NAME:-user-api}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["migrate"]
    volumes:
      - ${MIGRATION_PATH:-./db/migration}:/flyway/sql:ro

  flyway-postgres:
    <<: *container-security

    image: flyway/flyway:latest@sha256:c748a1e82c40d4ee63b2f02a78295cf2460e8b4f1abae8abcd7ad5d6e879f959

    user: "10001:10001"
    working_dir: /tmp

    restart: "no"

    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 30s

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mydb}
      FLYWAY_USER: ${POSTGRES_USER:-datnguyen}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FLYWAY_CONNECT_RETRIES: "60"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      JAVA_ARGS: -Duser.home=/tmp

    command: ["migrate"]

    volumes:
      - ${POSTGRES_MIGRATION_PATH:-./db/postgres/migration}:/flyway/sql:ro
  
  user-api:
    <<: *container-security
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 45s

    env_file:
      - .env

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777

    build:
      context: ./springboot-user-api
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      flyway-mysql:
        condition: service_completed_successfully

    volumes:
      - user_api_logs:/app/data/logs
      - ./key:/run/keys/jwt:ro

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-japanese_learning}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-japanese_learning}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      APP_LOG_DIR: /app/data/logs
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

      JWT_ISSUER: ${JWT_ISSUER:-japaneselearning-user-service}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS:-30}

    ports:
      - "127.0.0.1:${USER_API_HOST_PORT:-8080}:8080"

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "--max-time", "5", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  learning-api:
    <<: *container-security
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 45s

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777

    build:
      context: ./springboot-learning-api
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      flyway-postgres:
        condition: service_completed_successfully

    volumes:
      - learning_api_logs:/app/data/logs

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mydb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-datnguyen}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      APP_LOG_DIR: /app/data/logs
      APP_NAME: learning-api
      LOG_LEVEL: ${LEARNING_API_LOG_LEVEL:-INFO}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

    ports:
      - "127.0.0.1:${LEARNING_API_HOST_PORT:-8081}:8080"

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "--max-time", "5", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  loki:
    <<: *container-security
    image: grafana/loki:3.5.8
    user: "10001:10001"

    restart: unless-stopped

    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 128

    command:
      - -config.file=/etc/loki/loki-config.yml

    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"

    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

  
  fluent-bit:
    <<: *container-security
    image: cr.fluentbit.io/fluent/fluent-bit:3.2
    user: "10001:10001"

    restart: unless-stopped

    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128

    depends_on:
      - loki

    command:
      - --config=/fluent-bit/etc/fluent-bit.conf

    volumes:
      - ./observability/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - user_api_logs:/logs:ro
      - fluent_bit_state:/fluent-bit/state

  grafana:
    <<: *container-security
    image: grafana/grafana:12.2.0
    user: "472:0"

    restart: unless-stopped

    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 256

    depends_on:
      - loki

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_MODE: console

    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources/loki.yml:/etc/grafana/provisioning/datasources/loki.yml:ro

  opensearch:
    <<: *container-security
    # Vendor startup creates the keystore and runtime configuration.
    read_only: false
    image: opensearchproject/opensearch:3.9.0
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 512
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      bootstrap.memory_lock: "false"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      - opensearch_logs:/usr/share/opensearch/logs
    ports:
      - "127.0.0.1:${OPENSEARCH_HOST_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' | grep -q '\"timed_out\":false'"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 40s

  opensearch-dashboards:
    <<: *container-security
    # Vendor startup removes the disabled security plugin and writes runtime state.
    read_only: false
    image: opensearchproject/opensearch-dashboards:3.9.0
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1
    pids_limit: 256
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    ports:
      - "127.0.0.1:${OPENSEARCH_DASHBOARDS_HOST_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "--max-time", "5", "http://localhost:5601/api/status"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 60s

volumes:
  mysql_data:
  user_api_logs:
  learning_api_logs:
  loki_data:
  fluent_bit_state:
  grafana_data:
  opensearch_data:
  opensearch_logs:
  postgres_data:
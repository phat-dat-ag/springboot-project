# Shared runtime restrictions; writable state is declared explicitly per service.
x-observability-logging: &observability-logging
  driver: json-file
  options:
    max-size: ${OBS_DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${OBS_DOCKER_LOG_MAX_FILES:-3}
    compress: "true"

x-container-security: &container-security
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  ulimits:
    core: 0

services:
  mysql:
    <<: *container-security
    # The pinned vendor initializer interpolates SQL literals and a quoted option
    # file. Reject unsupported values before it can echo a credential in an error.
    entrypoint:
      - /bin/bash
      - -ec
      - |
        for name in MYSQL_DATABASE MYSQL_USER; do
          value="$${!name-}"
          if [[ ! "$$value" =~ ^[A-Za-z0-9_-]{1,64}$$ ]]; then
            echo "Invalid $$name: use 1-64 ASCII letters, digits, underscores or hyphens." >&2
            exit 64
          fi
        done
        for name in MYSQL_ROOT_PASSWORD MYSQL_PASSWORD; do
          value="$${!name-}"
          if [[ -z "$${value//[[:space:]]/}" || "$$value" == *"'"* || "$$value" == *'"'* || "$$value" == *'\'* || "$$value" =~ [[:cntrl:]] ]]; then
            echo "Invalid $$name: a nonblank password without quotes, backslashes or control characters is required by this MySQL image." >&2
            exit 64
          fi
        done
        exec /usr/local/bin/docker-entrypoint.sh mysqld
    user: "999:999"
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 60s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/mysqld:rw,noexec,nosuid,nodev,size=16m,uid=999,gid=999,mode=0750
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}

    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3336}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    <<: *container-security
    image: postgres:17.6
    user: "999:999"

    restart: unless-stopped

    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 60s

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=999,gid=999,mode=0750

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  flyway-mysql:
    <<: *container-security
    user: "10001:10001"
    working_dir: /tmp
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 30s
    tmpfs:
      # Java native libraries may require executable mappings from temporary storage.
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    image: flyway/flyway:latest@sha256:c748a1e82c40d4ee63b2f02a78295cf2460e8b4f1abae8abcd7ad5d6e879f959
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      FLYWAY_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}

      FLYWAY_CONNECT_RETRIES: ${FLYWAY_CONNECT_RETRIES:-60}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      JAVA_ARGS: -Duser.home=/tmp

      APP_LOG_DIR: ${APP_LOG_DIR:-/app/data/logs}
      APP_NAME: ${FLYWAY_MYSQL_APP_NAME:-flyway-mysql}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    command: ["migrate"]
    volumes:
      - ${USER_API_MIGRATION_PATH:-./db/migration/user}:/flyway/sql:ro

  flyway-postgres:
    <<: *container-security

    image: flyway/flyway:latest@sha256:c748a1e82c40d4ee63b2f02a78295cf2460e8b4f1abae8abcd7ad5d6e879f959

    user: "10001:10001"
    working_dir: /tmp

    restart: "no"

    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 30s

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      FLYWAY_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

      FLYWAY_CONNECT_RETRIES: ${FLYWAY_CONNECT_RETRIES:-60}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      JAVA_ARGS: -Duser.home=/tmp

    command: ["migrate"]

    volumes:
      - ${LEARNING_API_MIGRATION_PATH:-./db/migration/learning}:/flyway/sql:ro
  
  user-api:
    <<: *container-security
    logging: *observability-logging
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 45s

    env_file:
      - ./.env.user-api

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777

    build:
      context: ./springboot-user-api
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      flyway-mysql:
        condition: service_completed_successfully

    volumes:
      - user_api_logs:/app/data/logs
      - type: bind
        source: ${USER_SIGNING_KEYS_DIR:-./key}/userservice-private-v1.pem
        target: /run/keys/jwt/userservice-private-v1.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${USER_SIGNING_KEYS_DIR:-./key}/userservice-private-v2.pem
        target: /run/keys/jwt/userservice-private-v2.pem
        read_only: true
        bind:
          create_host_path: false

    environment:
      # HTTP listener (container port matches health checks)
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080

      # Database
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}

      # Authentication
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in .env}
      JWT_JWK_SET_URI: ${USER_JWT_JWK_SET_URI:-http://jwks-api:8080/api/v1/jwks/user}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS:-30}
      INTERNAL_JWT_JWK_SET_URI: ${INTERNAL_JWT_JWK_SET_URI:-http://jwks-api:8080/api/v1/jwks/learning}
      INTERNAL_JWT_ISSUER: ${INTERNAL_JWT_ISSUER:-learning-service}
      INTERNAL_JWT_SUBJECT: ${INTERNAL_JWT_SUBJECT:-learning-service}
      INTERNAL_JWT_AUDIENCE: ${INTERNAL_JWT_AUDIENCE:-user-service}
      INTERNAL_JWT_CLOCK_SKEW: ${INTERNAL_JWT_CLOCK_SKEW:-5s}
      INTERNAL_JWT_MAX_LIFETIME: ${INTERNAL_JWT_MAX_LIFETIME:-300s}

      # Logging
      APP_LOG_DIR: /app/data/logs
      APP_NAME: ${USER_API_APP_NAME:-user-api}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Private scrape listener; no published host port. Public metrics remain forbidden.
      METRICS_LISTENER_ENABLED: "true"
      METRICS_LISTENER_PORT: 9091
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus

      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "true"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}

      # Health probes
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

    ports:
      - "127.0.0.1:${USER_API_HOST_PORT:-8080}:8080"

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "--max-time", "5", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  learning-api:
    <<: *container-security
    logging: *observability-logging

    env_file:
      - ./.env.learning-api

    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 45s

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777

    build:
      context: ./springboot-learning-api
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      flyway-postgres:
        condition: service_completed_successfully

    volumes:
      - learning_api_logs:/app/data/logs
      - type: bind
        source: ${LEARNING_SIGNING_KEYS_DIR:-./data/keys/learning}/learningservice-private-v1.pem
        target: /run/keys/learning/learningservice-private-v1.pem
        read_only: true
        bind:
          create_host_path: false

    environment:
      # HTTP listener (container port matches health checks)
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080

      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

      # Authentication
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in .env}
      JWT_JWK_SET_URI: ${LEARNING_JWT_JWK_SET_URI:-http://jwks-api:8080/api/v1/jwks/user}
      JWT_CLOCK_SKEW: ${JWT_CLOCK_SKEW:-60s}

      # Internal service identity signing
      LEARNING_INTERNAL_JWT_ENABLED: ${LEARNING_INTERNAL_JWT_ENABLED:-true}
      LEARNING_INTERNAL_JWT_ISSUER: ${LEARNING_INTERNAL_JWT_ISSUER:-learning-service}
      LEARNING_INTERNAL_JWT_AUDIENCE: ${LEARNING_INTERNAL_JWT_AUDIENCE:-user-service}
      LEARNING_INTERNAL_JWT_TTL: ${LEARNING_INTERNAL_JWT_TTL:-60s}

      # JWKS diagnostic client
      JWKS_SERVICE_BASE_URL: ${JWKS_SERVICE_BASE_URL:-http://jwks-api:8080}
      JWKS_SERVICE_GET_PUBLIC_KEYS: ${JWKS_SERVICE_GET_PUBLIC_KEYS:-/api/v1/jwks/user}

      # User Service HTTP client
      USER_SERVICE_BASE_URL: ${USER_SERVICE_BASE_URL:-http://user-api:8080}
      USER_SERVICE_GET_USER: ${USER_SERVICE_GET_USER:-/internal/users}
      USER_SERVICE_CONNECT_TIMEOUT: ${USER_SERVICE_CONNECT_TIMEOUT:-3s}
      USER_SERVICE_READ_TIMEOUT: ${USER_SERVICE_READ_TIMEOUT:-5s}
      USER_SERVICE_INTERNAL_JWT_ENABLED: ${USER_SERVICE_INTERNAL_JWT_ENABLED:-true}

      # Logging
      APP_LOG_DIR: /app/data/logs
      APP_NAME: ${LEARNING_API_APP_NAME:-learning-api}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      LOG_LEVEL: ${LEARNING_API_LOG_LEVEL:-INFO}

      # Private scrape listener; no published host port. Public metrics remain forbidden.
      METRICS_LISTENER_ENABLED: "true"
      METRICS_LISTENER_PORT: 9091
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus

      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "true"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}

      # Health probes
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

    ports:
      - "127.0.0.1:${LEARNING_API_HOST_PORT:-8081}:8080"

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "--max-time", "5", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  jwks-api:
    <<: *container-security
    logging: *observability-logging
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 45s

    env_file:
      - ./.env.jwks-api

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777

    build:
      context: ./springboot-jwks-api
      dockerfile: Dockerfile

    restart: unless-stopped

    volumes:
      - jwks_api_logs:/app/data/logs
      - type: bind
        source: ${JWKS_KEYS_DIR:-./key}/userservice-public-v1.pem
        target: /run/keys/jwt/userservice-public-v1.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${JWKS_KEYS_DIR:-./key}/userservice-public-v2.pem
        target: /run/keys/jwt/userservice-public-v2.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LEARNING_SIGNING_KEYS_DIR:-./data/keys/learning}/learningservice-public-v1.pem
        target: /run/keys/learning/learningservice-public-v1.pem
        read_only: true
        bind:
          create_host_path: false

    environment:
      # HTTP listener (container port matches health checks)
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080

      # Logging
      APP_LOG_DIR: /app/data/logs
      APP_NAME: ${JWKS_API_APP_NAME:-jwks-api}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      LOG_LEVEL: ${JWKS_API_LOG_LEVEL:-INFO}

      # Private scrape listener; existing health endpoint paths remain unchanged.
      METRICS_LISTENER_ENABLED: "true"
      METRICS_LISTENER_PORT: 9091
      
      # Health endpoints
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus

      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "true"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

    ports:
      - "127.0.0.1:${JWKS_API_HOST_PORT:-8783}:8080"

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "--max-time", "5", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  loki:
    <<: *container-security
    logging: *observability-logging
    image: grafana/loki:3.5.8
    user: "10001:10001"

    restart: unless-stopped

    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 128

    command:
      - -config.file=/etc/loki/loki-config.yml

    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"

    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
  
  fluent-bit-state-init:
    <<: *container-security
    # Reuse the database image already required by this stack for its shell tools.
    image: postgres:17.6
    user: "0:0"
    network_mode: none
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    mem_limit: 64m
    pids_limit: 32
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - chown -R 10001:10001 /fluent-bit/state && chmod 0750 /fluent-bit/state
    volumes:
      - fluent_bit_state:/fluent-bit/state

  fluent-bit:
    <<: *container-security
    logging: *observability-logging
    image: cr.fluentbit.io/fluent/fluent-bit:3.2.10
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      FLUENT_BIT_LOKI_BUFFER_LIMIT: ${FLUENT_BIT_LOKI_BUFFER_LIMIT:-64M}
      FLUENT_BIT_OPENSEARCH_BUFFER_LIMIT: ${FLUENT_BIT_OPENSEARCH_BUFFER_LIMIT:-32M}
    user: "10001:10001"

    restart: unless-stopped

    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 40s

    depends_on:
      fluent-bit-state-init:
        condition: service_completed_successfully
      loki:
        condition: service_started
      opensearch:
        condition: service_healthy

    command:
      - --config=/fluent-bit/etc/fluent-bit.conf

    volumes:
      - ./observability/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./observability/fluent-bit/parsers.conf:/fluent-bit/etc/application-parsers.conf:ro
      - user_api_logs:/logs:ro
      - learning_api_logs:/learning-logs:ro
      - jwks_api_logs:/jwks-logs:ro
      - fluent_bit_state:/fluent-bit/state

  grafana:
    <<: *container-security
    logging: *observability-logging
    image: grafana/grafana:12.2.0
    user: "472:0"

    restart: unless-stopped

    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 256

    depends_on:
      - loki

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"

      GF_LOG_MODE: console

    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources/loki.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - ./observability/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./observability/grafana/provisioning/datasources/tempo.yml:/etc/grafana/provisioning/datasources/tempo.yml:ro
      - ./observability/grafana/provisioning/dashboards/application-logs.yml:/etc/grafana/provisioning/dashboards/application-logs.yml:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro

  otel-collector:
    <<: *container-security
    logging: *observability-logging
    image: otel/opentelemetry-collector-contrib:0.143.0
    user: "10001:10001"
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 30s
    environment:
      GOMEMLIMIT: 180MiB
      OTEL_QUEUE_CAPACITY_BYTES: ${OTEL_QUEUE_CAPACITY_BYTES:-67108864}
    depends_on:
      otel-queue-init:
        condition: service_completed_successfully
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector/config.yml:/etc/otelcol/config.yml:ro
      - otel_queue:/var/lib/otelcol

  otel-queue-init:
    <<: *container-security
    image: postgres:17.6
    user: "0:0"
    network_mode: none
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    mem_limit: 64m
    pids_limit: 32
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 10001:10001 /var/lib/otelcol && chmod 0750 /var/lib/otelcol"]
    volumes:
      - otel_queue:/var/lib/otelcol

  tempo-storage-init:
    <<: *container-security
    image: postgres:17.6
    user: "0:0"
    network_mode: none
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    mem_limit: 64m
    pids_limit: 32
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 10001:10001 /var/tempo && chmod 0750 /var/tempo"]
    volumes:
      - tempo_data:/var/tempo

  tempo:
    <<: *container-security
    logging: *observability-logging
    image: grafana/tempo:2.9.0
    user: "10001:10001"
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 45s
    depends_on:
      tempo-storage-init:
        condition: service_completed_successfully
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

  prometheus:
    <<: *container-security
    logging: *observability-logging
    image: prom/prometheus:v3.13.5
    user: "65534:65534"
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 30s
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=0.0.0.0:9090
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  opensearch:
    <<: *container-security
    logging: *observability-logging
    # Vendor startup creates the keystore and runtime configuration.
    read_only: false
    image: opensearchproject/opensearch:3.9.0
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 512
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "false"

      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}

      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      - opensearch_logs:/usr/share/opensearch/logs
    ports:
      - "127.0.0.1:${OPENSEARCH_HOST_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' | grep -q '\"timed_out\":false'"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 40s

  opensearch-dashboards:
    <<: *container-security
    logging: *observability-logging
    # Vendor startup removes the disabled security plugin and writes runtime state.
    read_only: false
    image: opensearchproject/opensearch-dashboards:3.9.0
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1
    pids_limit: 256
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    ports:
      - "127.0.0.1:${OPENSEARCH_DASHBOARDS_HOST_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "--max-time", "5", "http://localhost:5601/api/status"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 60s

volumes:
  otel_queue:
  tempo_data:
  prometheus_data:
  mysql_data:
  user_api_logs:
  learning_api_logs:
  jwks_api_logs:
  loki_data:
  fluent_bit_state:
  grafana_data:
  opensearch_data:
  opensearch_logs:
  postgres_data:
